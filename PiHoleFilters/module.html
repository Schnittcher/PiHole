<style>
.note{font-size:.85em;color:var(--warn);margin-bottom:.2em;flex:none}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5em,1fr));grid-auto-rows:1fr;gap:.6em}
.card{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:.5em .8em;border-radius:.8em;background:var(--c-ui-bg);border-left:3px solid var(--tone,var(--c-border))}
.card .v{font-size:1.9em;font-weight:200;letter-spacing:-.02em;line-height:1.05}
.card .k{font-size:.85em;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card:last-child:nth-child(odd){grid-column:1/-1}
.card.ok{--tone:var(--ok)}
.card.bad{--tone:var(--bad)}
.card.acc{--tone:var(--accent)}
</style>
<div class="tile" id="tile">
  <div class="note" id="note" style="display:none"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
function handleMessage(json) {
  var d = JSON.parse(json), t = d.t;
  document.getElementById('tile').classList.toggle('offline', !d.connected);
  var note = document.getElementById('note');
  note.textContent = t.offline || '';
  note.style.display = d.connected ? 'none' : '';
  var items = [
    ['acc', d.lists, t.lists],
    ['acc', d.groups, t.groups],
    ['acc', d.clients, t.clients],
    ['ok', d.allowed, t.allowed],
    ['bad', d.denied, t.denied]
  ];
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  items.forEach(function (it) {
    var c = document.createElement('div'); c.className = 'card ' + it[0];
    var v = document.createElement('div'); v.className = 'v'; v.textContent = shortNum(it[1]);
    var k = document.createElement('div'); k.className = 'k'; k.textContent = it[2];
    c.appendChild(v); c.appendChild(k); grid.appendChild(c);
  });
}
scaleTile(document.getElementById('tile'), 20, 22);
</script>
