<style>
.note{font-size:.85em;color:var(--warn);margin-bottom:.2em;flex:none}
.actions{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.5em}
.act{display:flex;align-items:center;gap:.7em;text-align:left;padding:.6em .9em}
.act svg{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.act span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act:disabled{opacity:.5;cursor:default}
.act.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.last{flex:none;margin-top:.6em;font-size:.88em;color:var(--text-sub);line-height:1.35}
.last b{font-weight:500;color:var(--text)}
.tile.no-last .last{display:none}
</style>
<div class="tile" id="tile">
  <div class="note" id="note" style="display:none"></div>
  <div class="actions" id="actions"></div>
  <div class="last" id="last"></div>
</div>
<script>
// Gravity, DNS-Neustart und ARP-Cache: die Werte entsprechen den Aktionen des Moduls
var ACTIONS = [
  [1, 'gravity', 'M12 3v12m0 0l-4-4m4 4l4-4M4 19h16'],
  [2, 'restart', 'M4 12a8 8 0 1 1 3 6.2M4 19v-5h5'],
  [4, 'arp', 'M4 6h16M4 12h16M4 18h10']
];

function handleMessage(json) {
  var d = JSON.parse(json), t = d.t;
  document.getElementById('tile').classList.toggle('offline', !d.connected);
  var note = document.getElementById('note');
  note.textContent = t.offline || '';
  note.style.display = d.connected ? 'none' : '';

  var box = document.getElementById('actions');
  box.innerHTML = '';
  ACTIONS.forEach(function (a) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn act' + (d.busy === a[0] ? ' busy' : '');
    b.disabled = !!d.busy;
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + a[2] + '"/></svg><span></span>';
    b.querySelector('span').textContent = d.busy === a[0] ? t.running : t[a[1]];
    b.onclick = function () { requestAction('Action', a[0]); };
    box.appendChild(b);
  });

  var last = document.getElementById('last');
  last.innerHTML = '';
  if (d.lastRun > 0) {
    var when = new Date(d.lastRun * 1000).toLocaleString([], {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
    var b1 = document.createElement('b'); b1.textContent = t.lastRun + ' ' + when;
    last.appendChild(b1);
    last.appendChild(document.createElement('br'));
    last.appendChild(document.createTextNode(d.lastResult || ''));
  } else {
    last.textContent = t.never;
  }
}
var _tile = document.getElementById('tile');
scaleTile(_tile, 18, 16, function (w, h) { _tile.classList.toggle('no-last', h < parseFloat(_tile.style.fontSize) * 15); });
</script>
